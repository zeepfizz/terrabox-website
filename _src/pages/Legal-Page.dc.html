<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<x-dc>
<helmet>
<!-- Shared legal page body, rendered by legal_page() in _src/build.py. -->
</helmet>
<section class="phero" aria-labelledby="h1">
  <div class="wrap phero__grid">
    <nav class="phero__crumb" aria-label="Ruta de navegación"><a href="Inicio.dc.html">Inicio</a> / <span aria-current="page">{{ title }}</span></nav>
    <h1 id="h1" class="display">{{ title }}</h1>
    <div class="phero__aside phero__fact">
      <p>{{ dateLabel }}: {{ cfg.legalDate }}.</p>
      <div class="actions"><button type="button" class="btn btn--accent" onclick="window.print()">Imprimir</button></div>
    </div>
  </div>
</section>
<article class="wrap legal-copy" aria-labelledby="h1">
  <dc-import name="Include" file="{{ file }}"></dc-import>
</article>
</x-dc>
</body>
</html>
