<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Ingresar | TerraBox</title>
<meta name="description" content="Ingresa a tu cuenta TerraBox para ver tus paquetes, prealertar compras y pagar tus envíos.">
<link rel="stylesheet" href="_ds/terrabox-cargo-design-system-cccd872f-d644-4349-8450-b88a6dd7b8b5/styles.css">
<script src="_ds/terrabox-cargo-design-system-cccd872f-d644-4349-8450-b88a6dd7b8b5/_ds_bundle.js"></script>
<script src="site.js"></script>
</helmet>
<dc-import name="Site-Header" wa-page="Ingresar" hide-wa="{{ true }}" hint-size="100%,68px"></dc-import>
<main id="main" tabindex="-1" style="outline:none">
  <section aria-labelledby="h1" style="padding:clamp(40px,6vw,80px) var(--space-5) clamp(56px,8vw,96px)">
    <div style="max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:var(--space-6)">
      <h1 id="h1" style="margin:0;font:700 clamp(30px,4vw,40px)/1.1 var(--font-display);letter-spacing:var(--ls-display);color:var(--text-heading)">Ingresar</h1>
      <div style="background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:clamp(20px,3vw,32px);display:flex;flex-direction:column;gap:var(--space-5)">
        <div id="login-msg" hidden tabindex="-1" role="alert" style="padding:var(--space-4);border-radius:var(--radius-md);font:500 14px/1.5 var(--font-sans);outline:none"></div>
        <form id="login-form" novalidate style="display:flex;flex-direction:column;gap:var(--space-5)">
          <x-import component-from-global-scope="TerraboxCargoDesignSystem_cccd87.Input" id="login-email" label="Email" type="email" autocomplete="email" inputmode="email" size="lg" data-hint-slot="1"></x-import>
          <div id="login-pw-wrap" style="display:flex;flex-direction:column;gap:6px">
            <x-import component-from-global-scope="TerraboxCargoDesignSystem_cccd87.Input" id="login-pw" label="Contraseña" type="password" autocomplete="current-password" size="lg" data-hint-slot="1"></x-import>
            <div style="display:flex;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap">
              <button type="button" id="login-pw-toggle" aria-pressed="false" style="min-height:32px;border:0;background:transparent;padding:0;font:600 13px/1 var(--font-sans);color:var(--blue-600);cursor:pointer">Mostrar contraseña</button>
              <button type="button" id="login-to-forgot" style="min-height:32px;border:0;background:transparent;padding:0;font:600 13px/1 var(--font-sans);color:var(--blue-600);cursor:pointer">Olvidé mi contraseña</button>
            </div>
          </div>
          <p id="login-forgot-note" hidden style="margin:0;font:400 14px/1.5 var(--font-sans);color:var(--fg-2)">Te enviamos un enlace para crear una nueva contraseña. El enlace vence en 30 minutos.</p>
          <x-import component-from-global-scope="TerraboxCargoDesignSystem_cccd87.Button" id="login-submit" type="submit" size="lg" full-width="{{ true }}">Ingresar</x-import>
          <button type="button" id="login-to-login" hidden style="min-height:44px;border:0;background:transparent;font:600 14px/1 var(--font-sans);color:var(--blue-600);cursor:pointer">Volver a Ingresar</button>
        </form>
      </div>
      <p style="margin:0;text-align:center;font:400 15px/1.6 var(--font-sans);color:var(--fg-2)">¿Aún no tienes casillero? <a href="Registro.dc.html">Abrir casillero gratis</a></p>
    </div>
  </section>
</main>
<dc-import name="Site-Footer" wa-page="Ingresar" hint-size="100%,480px"></dc-import>
</x-dc>
<script type="application/json" data-page>
{}
</script>
<script src="assets/js/pages/ingresar.js"></script>
</body>
</html>
